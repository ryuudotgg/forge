name: Smoke

on:
  push:
    branches: ["main"]

  pull_request:

  merge_group:
  workflow_dispatch:

  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_COLOR: 3
  DO_NOT_TRACK: true

  # https://turborepo.org/docs/core-concepts/remote-caching
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  changes:
    name: Detect Smoke Changes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: depot-ubuntu-latest
    permissions:
      contents: read

    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect Relevant Changes
        id: changes
        run: |
          relevant=false

          if ! diff_output=$(git -c core.quotePath=false diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"); then
            echo '::error::git diff failed to compute changed paths' >&2
            exit 1
          fi

          while IFS= read -r changed_path; do
            [ -z "$changed_path" ] && continue
            case "$changed_path" in
              packages/cli/tests/* | packages/core/tests/* | packages/generators/tests/*)
                continue
                ;;
              .depot/workflows/smoke.yml | package.json | .nvmrc | tooling/github/setup/* | packages/cli/* | packages/core/* | packages/generators/* | pnpm-lock.yaml | pnpm-workspace.yaml | tests/scenarios/package.json | tests/scenarios/turbo.json | tests/scenarios/vitest.config.ts | tests/scenarios/src/scenarios/*.smoke.test.ts | tests/scenarios/src/utils/* | tests/scenarios/scripts/* | examples/registry-package/*)
                relevant=true
                break
                ;;
            esac
          done <<< "$diff_output"

          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

  smoke:
    name: Install Smoke
    needs: [changes]
    if: ${{ always() && (github.event_name != 'pull_request' || needs.changes.result == 'failure' || needs.changes.outputs.relevant == 'true') }}
    runs-on: depot-ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mysql:
        image: mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
        env:
          MYSQL_ROOT_PASSWORD: mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmysql"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./tooling/github/setup

      - name: Build CLI
        run: pnpm build --filter=@ryuugg/forge

      - name: Smoke Test
        run: pnpm --filter @ryuugg/scenarios exec vitest run src/scenarios/install- --maxWorkers=3 --reporter=default --reporter=github-actions --reporter=json --outputFile.json=.cache/install-smoke.json
        env:
          FORGE_SMOKE: "1"
          FORGE_SMOKE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          FORGE_SMOKE_MYSQL_URL: mysql://root:mysql@127.0.0.1:3306
          TURBO_FORCE: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

      - name: Smoke Timing Report
        if: ${{ !cancelled() }}
        run: node tests/scenarios/scripts/smoke-report.mts tests/scenarios/.cache/install-smoke.json

      - name: Upload Smoke Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-smoke-report
          path: tests/scenarios/.cache/install-smoke.json

      - name: Tarball Smoke
        run: pnpm --filter @ryuugg/scenarios exec vitest run src/scenarios/tarball.smoke.test.ts
        env:
          FORGE_SMOKE: "1"

      - name: Registry Smoke
        run: pnpm --filter @ryuugg/scenarios exec vitest run src/scenarios/registry.smoke.test.ts
        env:
          FORGE_SMOKE: "1"

      - name: Multi-PM Smoke
        if: ${{ github.event_name != 'merge_group' }}
        run: pnpm --filter @ryuugg/scenarios exec vitest run src/scenarios/multi-pm.smoke.test.ts
        env:
          FORGE_SMOKE: "1"
          TURBO_FORCE: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

  gate:
    name: Install Smoke Gate
    needs: [smoke]
    if: ${{ always() }}
    runs-on: depot-ubuntu-latest
    permissions: {}

    steps:
      - name: Verify Smoke Result
        run: |
          if [[ "$SMOKE_RESULT" == "failure" || "$SMOKE_RESULT" == "cancelled" ]]; then
            echo "Install Smoke Result: $SMOKE_RESULT."
            exit 1
          fi
        env:
          SMOKE_RESULT: ${{ needs.smoke.result }}
