packages:
  - packages/*
  - tests/*
  - tooling/*

overrides:
  "@effect/platform-node-shared": "catalog:effect"

catalogs:
  scaffold:
    "@better-auth/passkey": 1.7.7
    "@orpc/server": 1.15.4
    "@polar-sh/better-auth": ^2.0.1
    "@polar-sh/sdk": ^1.0.2
    better-auth: 1.7.7
    expo: 57.0.26
    react: ^19.2.5
    react-dom: ^19.2.5
    react-email: 6.11.0

  # ===== BUILD TOOLS =====
  build:
    tsdown: ^0.23.0

  # ===== DEVELOPMENT TOOLS =====
  dev:
    # Git Hooks & Development Workflow
    lefthook: ^2.1.16

    # TypeScript & Compilation
    "@types/node": 24.19.1
    typescript: 7.0.2
    vitest: 5.0.3
    vite: 8.3.1
    "@vitest/coverage-v8": 5.0.3

  # ===== LINTING & FORMATTING =====
  lint:
    # Biome (ESLint/Prettier Alternative)
    "@biomejs/biome": 2.5.15

    # Commit Linting
    "@commitlint/cli": ^21.2.3
    "@commitlint/config-conventional": ^21.2.3
    "@commitlint/types": ^21.2.3
    sherif: ^1.13.0

  # ===== MONOREPO =====
  monorepo:
    turbo: ^2.11.7

  release:
    tegami: 1.5.0

  # ===== NODE.JS ENVIRONMENT =====
  node:
    # CLI Framework
    "@clack/prompts": 1.8.1
    "@clack/core": 1.5.1

    # Color Utilities
    picocolors: ^1.1.1

  # ===== EFFECT =====
  effect:
    effect: 4.0.0-rc.117
    "@effect/platform-node": 4.0.0-rc.117
    "@effect/platform-node-shared": 4.0.0-rc.117
    "@effect/tsgo": ^0.48.0
    "@effect/vitest": 4.0.0-rc.117

nodeLinker: hoisted
linkWorkspacePackages: true
minimumReleaseAge: 1440 # 24 Hours

allowBuilds:
  "@parcel/watcher": true
  msgpackr-extract: true
  lefthook: true
  esbuild: true
