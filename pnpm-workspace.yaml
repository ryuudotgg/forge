packages:
  - packages/*
  - tests/*
  - tooling/*

overrides:
  "@effect/platform-node-shared": "catalog:effect"

catalogs:
  scaffold:
    "@better-auth/passkey": 1.7.14
    "@biomejs/biome": 2.6.4
    "@orpc/server": 1.16.1
    "@polar-sh/better-auth": ^2.1.3
    "@polar-sh/sdk": ^1.0.2
    better-auth: 1.7.14
    expo: 58.0.21
    oxfmt: 0.75.0
    oxlint: 1.90.0
    react: ^19.3.1
    react-dom: ^19.3.1
    react-email: 6.11.6

  # ===== BUILD TOOLS =====
  build:
    tsdown: ^0.23.4

  # ===== DEVELOPMENT TOOLS =====
  dev:
    # Git Hooks & Development Workflow
    lefthook: ^2.2.2

    # TypeScript & Compilation
    "@types/node": 26.6.6
    typescript: 7.0.2
    vitest: 5.0.5
    vite: 8.3.5
    "@vitest/coverage-v8": 5.0.5

  # ===== LINTING & FORMATTING =====
  lint:
    # Biome (ESLint/Prettier Alternative)
    "@biomejs/biome": 2.6.3

    # Commit Linting
    "@commitlint/cli": ^21.2.4
    "@commitlint/config-conventional": ^21.2.4
    "@commitlint/types": ^21.2.3
    sherif: ^1.13.0
    "@ryuugg/stanza": 0.3.3

  # ===== MONOREPO =====
  monorepo:
    turbo: ^2.11.10

  release:
    tegami: 1.5.0

  # ===== NODE.JS ENVIRONMENT =====
  node:
    # CLI Framework
    "@clack/prompts": 1.8.1
    "@clack/core": 1.5.1

    # Color Utilities
    picocolors: ^1.1.1

  # ===== EFFECT =====
  effect:
    effect: 4.1.0
    "@effect/platform-node": 4.1.0
    "@effect/platform-node-shared": 4.1.0
    "@effect/tsgo": ^0.63.0
    "@effect/vitest": 4.1.0

nodeLinker: hoisted
linkWorkspacePackages: true
minimumReleaseAge: 1440 # 24 Hours

allowBuilds:
  "@parcel/watcher": true
  msgpackr-extract: true
  lefthook: true
  esbuild: true
minimumReleaseAgeExclude:
  # Renovate security update: vite@8.3.4
  - vite@8.3.4
