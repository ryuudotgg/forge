packages:
  - apps/*
  - packages/*
  - tests/*
  - tooling/*

overrides:
  "@effect/platform-node-shared": 4.0.0-rc.112

catalogs:
  # ===== BUILD TOOLS =====
  build:
    tsdown: ^0.23.0

  # ===== DEVELOPMENT TOOLS =====
  dev:
    # Git Hooks & Development Workflow
    lefthook: ^2.1.12

    # TypeScript & Compilation
    "@types/node": 24.13.3
    typescript: 7.0.2
    vitest: 4.1.11
    "@vitest/coverage-v8": 4.1.11

  # ===== LINTING & FORMATTING =====
  lint:
    # Biome (ESLint/Prettier Alternative)
    "@biomejs/biome": 2.5.11

    # Commit Linting
    "@commitlint/cli": ^21.2.2
    "@commitlint/config-conventional": ^21.2.2
    "@commitlint/types": ^21.2.0
    sherif: ^1.13.0

  # ===== MONOREPO =====
  monorepo:
    turbo: ^2.10.12

  # ===== NODE.JS ENVIRONMENT =====
  node:
    # CLI Framework
    "@clack/prompts": 1.7.0
    "@clack/core": 1.4.3

    # Color Utilities
    picocolors: ^1.1.1

  # ===== EFFECT =====
  effect:
    effect: 4.0.0-rc.112
    "@effect/platform-node": 4.0.0-rc.112
    "@effect/tsgo": ^0.38.0
    "@effect/vitest": 4.0.0-rc.112

nodeLinker: hoisted
linkWorkspacePackages: true
minimumReleaseAge: 1440 # 24 Hours

allowBuilds:
  "@parcel/watcher": true
  msgpackr-extract: true
  lefthook: true
  esbuild: true
