name: "Setup & Install"
description: "Setup & Install"

runs:
  using: composite
  steps:
    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ".nvmrc"
        cache: "yarn"

    - name: Install Dependencies
      shell: bash
      run: yarn install --immutable
