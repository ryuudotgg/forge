name: "Setup & Install"
description: "Setup & Install"

runs:
  using: composite
  steps:
    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: ".nvmrc"
        cache: "yarn"

    - name: Install Dependencies
      shell: bash
      run: yarn install --immutable
