name: Smoke

on:
  push:
    branches: ["main"]

  pull_request:

  merge_group:
  workflow_dispatch:

  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_COLOR: 3
  DO_NOT_TRACK: true

  # https://turborepo.org/docs/core-concepts/remote-caching
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  changes:
    name: Detect Smoke Changes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect Relevant Changes
        id: changes
        run: |
          relevant=false

          if ! diff_output=$(git -c core.quotePath=false diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"); then
            echo '::error::git diff failed to compute changed paths' >&2
            exit 1
          fi

          while IFS= read -r changed_path; do
            [ -z "$changed_path" ] && continue
            case "$changed_path" in
              packages/cli/tests/* | packages/core/tests/* | packages/generators/tests/*)
                continue
                ;;
              packages/cli/* | packages/core/* | packages/generators/* | pnpm-lock.yaml | tests/scenarios/src/scenarios/install.smoke.test.ts | tests/scenarios/src/scenarios/multi-pm.smoke.test.ts | tests/scenarios/src/utils/*)
                relevant=true
                break
                ;;
            esac
          done <<< "$diff_output"

          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

  smoke:
    name: Install Smoke
    needs: [changes]
    if: ${{ always() && (github.event_name != 'pull_request' || needs.changes.result == 'failure' || needs.changes.outputs.relevant == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./tooling/github/setup

      - name: Build CLI
        run: pnpm build --filter=@ryuujs/forge

      - name: Smoke Test
        run: pnpm --filter @ryuujs/scenarios exec vitest run src/scenarios/install.smoke.test.ts
        env:
          FORGE_SMOKE: "1"

      - name: Multi-PM Smoke
        if: ${{ github.event_name != 'merge_group' }}
        run: pnpm --filter @ryuujs/scenarios exec vitest run src/scenarios/multi-pm.smoke.test.ts
        env:
          FORGE_SMOKE: "1"

  gate:
    name: Install Smoke Gate
    needs: [smoke]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Verify Smoke Result
        run: |
          if [[ "$SMOKE_RESULT" == "failure" || "$SMOKE_RESULT" == "cancelled" ]]; then
            echo "Install Smoke Result: $SMOKE_RESULT."
            exit 1
          fi
        env:
          SMOKE_RESULT: ${{ needs.smoke.result }}
